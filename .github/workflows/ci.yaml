name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    name: build-test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v5

      - name: Install common build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qml6-module-qttest \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript
          # Main.qml imports Settings from QtCore on Qt >= 6.5 and from Qt.labs.settings
          # before that, and the packages don't track that split (Ubuntu 24.04's Qt 6.4
          # has a qml6-module-qtcore too), so install whichever of them apt offers.
          # The SVG image plugin is in qt6-svg-plugins from Qt 6.5 on and in libqt6svg6 before.
          for module in qml6-module-qtcore qml6-module-qt-labs-settings qt6-svg-plugins libqt6svg6; do
            if apt-cache show "$module" > /dev/null 2>&1; then
              sudo apt-get install -y "$module"
            fi
          done

      - name: Install GCC 14
        if: matrix.compiler == 'gcc'
        run: sudo apt-get install -y gcc-14 g++-14

      - name: Install Clang
        if: matrix.compiler == 'clang'
        run: sudo apt-get install -y clang

      - name: Configure (GCC)
        if: matrix.compiler == 'gcc'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMX_TOOLS_REQUIRE_QML_TEST=ON \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14

      - name: Configure (Clang)
        if: matrix.compiler == 'clang'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMX_TOOLS_REQUIRE_QML_TEST=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build --parallel

      # qmllint fails only on errors from Qt 6.8 on, but on Qt 6.4 it also fails on
      # warnings, some of them false positives, so there it only reports.
      - name: Lint QML
        run: |
          if pkg-config --atleast-version=6.8 Qt6Core; then
            cmake --build build --target mx-tools_qmllint
          elif ! cmake --build build --target mx-tools_qmllint; then
            echo "::warning::qmllint $(pkg-config --modversion Qt6Core) reported warnings; see the log above"
          fi

      # Includes the QML test, which loads Main.qml offscreen and fails on QML warnings.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  debian-package-check:
    name: debian package build canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            devscripts \
            debhelper \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools

      - name: Build binary package (unsigned)
        run: debuild -us -uc -b
